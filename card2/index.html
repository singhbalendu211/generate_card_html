<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .container{
            height: 100vh;
            width: 100vw;
            background-color: #546776;
            background-image: linear-gradient(135deg, #546776 0%, #7c7db8 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        
        }

        .card{
            width: 350px;
            height: 500px;
            background-color: white;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        #cardImage{
            height: 30%;
            width: 100%;
        }

        #cardImage img{
            width: 100%;
            height: 100%;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }

        .cardText{
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding-right: 12px;
            padding-left: 12px;

        }

        #cardPara{
            text-align: center;
        }

        .cardPlan{
            width: 87%;
            height: 9vh;
            background-color: rgb(192, 243, 243);
            border-radius: 7px;

            display: flex;
            justify-content: space-between;
           
        }

        #leftBox{
            height: 100%;
            display:flex ;
            align-items: center;
            gap: 15px;
        }

        #logo img{
            height: 50px;
            width: 50px;        }

        #rightBox{
            align-content: center;
            padding: 20px;
        }

        #rightBox a{
            text-decoration: none;
            font-size: large;
        }

        #cardBuy{
            width: 80%;
            height: 7vh;
            background-color: rgb(39, 48, 146);
            color: white;
            border-radius: 7px;
            align-content: center;
            text-align: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px;
        }


        #cardCancel{
            text-decoration: none;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            font-weight: bold;
            font-size: 1.1rem;
            color: black;
        }
    


    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div id="cardImage">
                <img src="icon.jpg" alt="">
            </div>

            <div class="cardText">
                <h2>Order Summary</h2>

                <p id="cardPara">
                    Lorem ipsum dolor sit amet consectetur adipisicing elit. Repellendus pariatur ipsa, aut error voluptatibus dolores.
                </p>
            </div>

            <div class="cardPlan">

                <div id="leftBox">

                    <div id="logo">
                        <img src="music.png" alt="">
                    </div>

                    <div id="textAmount">
                        <p>Annual Plan</p>
                        <p>$99.9/year</p>
                    </div>


                </div>

                <div id="rightBox">
                    <a href="#change">Change</a>
                </div>
            </div>

            <button id="cardBuy">
                Proceed To Payment
            </button>

            <a id="cardCancel" href="#cancel">
                Cancel Order
            </a>
            
        </div>
    </div>
</body>
</html>
